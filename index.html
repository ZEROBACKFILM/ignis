<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>이그니스 — 도트 로그라이크 RPG</title>
<!-- ===== PWA (v1.0) ===== -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="이그니스">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  @font-face{
    font-family:'DungGeunMo';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/DungGeunMo.woff') format('woff');
    font-display:swap;
  }
  :root{
    --gold:#e8b45e; --gold-hi:#ffe0a0; --gold-dk:#7a5426; --frame:#1c120a;
    --panel:#2e2018; --panel-dk:#231810;
    --bone:#f0e6d0; --bone-dim:#a89878;
    --hp:#e04838; --xp:#48c8a8; --sp:#68a8f0; --ember:#ff9a3c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0e0c12;
    font-family:'Galmuri11','DungGeunMo',sans-serif;color:var(--bone);
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
    image-rendering:pixelated;}
  #game{position:fixed;inset:0;display:block;image-rendering:pixelated;}
  canvas{image-rendering:pixelated;}

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel-dk));
    border:3px solid var(--frame);
    box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--gold-dk), 0 4px 0 #00000066;
  }
  .btn{
    pointer-events:auto;font-family:'Galmuri11','DungGeunMo',sans-serif;
    font-size:18px;color:#2a1808;letter-spacing:1px;
    background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,#c88f3e 55%,#a87428 100%);
    border:3px solid var(--frame);
    box-shadow: inset 0 2px 0 #fff6, inset 0 -3px 0 #0004, 0 4px 0 #000a;
    padding:12px 34px;cursor:pointer;
  }
  .btn:active{transform:translateY(3px);box-shadow: inset 0 2px 0 #fff6, inset 0 -3px 0 #0004, 0 1px 0 #000a;}

  /* ====== HUD ====== */
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;
    display:none;pointer-events:none;z-index:5;}
  #hudBox{display:flex;gap:8px;align-items:stretch;}
  #lvBadge{width:52px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;}
  #lvBadge .lv{font-size:9px;color:var(--gold);letter-spacing:1px;}
  #lvBadge .n{font-size:22px;color:var(--gold-hi);text-shadow:2px 2px 0 #000;}
  #bars{flex:1;padding:6px 8px;}
  .bar{position:relative;height:15px;background:#120c08;border:2px solid var(--frame);
    box-shadow:inset 0 0 0 1px #00000088;}
  .bar+.bar{margin-top:4px;height:11px;}
  .bar .fill{position:absolute;inset:1px auto 1px 1px;transition:width .18s;}
  #hpFill{background:linear-gradient(180deg,#ff7a60,var(--hp) 60%,#a02818);width:100%;}
  #xpFill{background:linear-gradient(180deg,#8ae8cc,var(--xp) 60%,#2a8870);width:0%;}
  .bar .txt{position:absolute;inset:0;display:flex;align-items:center;padding-left:5px;
    font-size:9px;color:#fff;text-shadow:1px 1px 0 #000;letter-spacing:1px;}
  #quest{margin-top:5px;text-align:right;font-size:11px;color:var(--gold-hi);
    text-shadow:1px 1px 0 #000;letter-spacing:1px;}
  #quest small{color:var(--bone-dim);font-size:10px;margin-right:6px;}
  #invTag{margin-top:3px;text-align:right;font-size:10px;color:var(--gold);text-shadow:1px 1px 0 #000;}
  #relicBar{display:flex;gap:4px;margin-top:5px;pointer-events:auto;}
  #equipBar{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:3px;pointer-events:auto;}
  #equipBar .eqChip{font-size:8px;text-shadow:1px 1px 0 #000;opacity:0.95;}
  #relicTip{position:fixed;z-index:8;display:none;max-width:230px;padding:8px 11px;font-size:10px;
    color:var(--bone);line-height:1.6;}
  #relicTip em{color:var(--gold-hi);font-style:normal;}
  #relicBar img{width:22px;height:22px;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 #0009);}
  #actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
    z-index:7;display:none;font-family:'Galmuri11','DungGeunMo',sans-serif;font-size:14px;
    color:var(--gold-hi);padding:12px 26px;cursor:pointer;letter-spacing:1px;text-shadow:1px 1px 0 #000;}
  #actBtn:active{transform:translate(-50%,2px);}
  #actBtn.no{color:#ff9a8a;}
  #tutMsg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:6;display:none;align-items:center;gap:12px;padding:10px 12px 10px 14px;max-width:92vw;}
  #tutMsg span{font-size:12px;color:var(--gold-hi);text-shadow:1px 1px 0 #000;line-height:1.5;}
  #tutMsg button{font-family:'Galmuri11','DungGeunMo',sans-serif;font-size:10px;color:var(--bone-dim);
    background:none;border:1px solid #ffffff2a;padding:5px 9px;cursor:pointer;flex:none;}
  #mapLabel{position:fixed;top:calc(70px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    pointer-events:none;z-index:5;display:none;font-size:15px;color:var(--gold-hi);
    text-shadow:2px 2px 0 #000;letter-spacing:2px;opacity:0;transition:opacity .6s;}

  /* ====== 오버레이 ====== */
  .overlay{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:22px;}
  .overlay.show{display:flex;}

  #title{background:radial-gradient(140% 90% at 50% 115%, #4a2810 0%, #1a1210 45%, #0e0c12 80%);}
  #title .eyebrow{font-size:12px;letter-spacing:4px;color:var(--bone-dim);margin-bottom:16px;text-shadow:1px 1px 0 #000;}
  #title h1{font-size:clamp(40px,12vw,68px);line-height:1.3;letter-spacing:4px;color:var(--gold-hi);
    text-shadow:0 3px 0 #a05818, 0 6px 0 #4a2808, 0 6px 22px #ff9a3c66;}
  #heroShow{margin:22px 0 6px;}
  #heroSelect{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 8px;}
  .hSlot{width:88px;padding:7px 4px 5px;cursor:pointer;background:#1a120c;
    border:2px solid var(--gold-dk);box-shadow:inset 0 0 0 1px #00000066, 0 3px 0 #0008;
    font-family:'Galmuri11','DungGeunMo',sans-serif;}
  .hSlot.sel{border-color:var(--gold-hi);background:#2a1c10;
    box-shadow:0 0 14px #ff9a3c55, inset 0 0 0 1px var(--gold), 0 3px 0 #0008;}
  .hSlot img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto;}
  .hSlot .hn{font-size:11px;color:var(--bone);margin-top:3px;letter-spacing:0;}
  .hSlot .hc{font-size:8px;color:var(--bone-dim);margin-top:1px;}
  .hSlot.sel .hc{color:var(--gold);}
  .hSlot.sel .hn{color:var(--gold-hi);}
  #heroDesc{font-size:11px;color:var(--gold);min-height:16px;margin-bottom:2px;text-shadow:1px 1px 0 #000;}
  #title .subEn{font-size:12px;letter-spacing:3px;color:var(--bone-dim);margin-top:10px;text-shadow:1px 1px 0 #000;}
  #title .heroHead{font-size:11px;letter-spacing:2px;color:var(--gold);margin-top:22px;text-shadow:1px 1px 0 #000;}
  #title .lore{max-width:330px;margin:14px 0 26px;font-size:13px;line-height:2;color:var(--bone-dim);text-shadow:1px 1px 0 #000;}
  #title .hint{margin-top:22px;font-size:10px;color:#6b6355;letter-spacing:1px;line-height:2;}
  #title .ver{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));font-size:9px;color:#544a3a;letter-spacing:1px;}

  #levelup,#event{background:#0a0810dd;}
  .ovPanel{width:min(380px,100%);padding:20px 18px;}
  .ovTag{font-size:11px;letter-spacing:4px;color:var(--xp);margin-bottom:6px;text-shadow:1px 1px 0 #000;}
  .ovTag.ember{color:var(--ember);}
  .ovTitle{font-size:22px;letter-spacing:2px;margin-bottom:6px;color:var(--gold-hi);text-shadow:2px 2px 0 #000;}
  .ovDesc{font-size:12px;color:var(--bone-dim);line-height:1.9;margin-bottom:18px;}
  .cards{display:flex;flex-direction:column;gap:10px;}
  .card{pointer-events:auto;text-align:left;display:flex;gap:12px;align-items:center;
    background:linear-gradient(180deg,#3a2a1c,#2a1c12);
    border:2px solid var(--frame);
    box-shadow:inset 0 0 0 1px var(--gold-dk), inset 0 2px 0 #ffffff14, 0 3px 0 #0008;
    padding:12px 13px;cursor:pointer;color:var(--bone);}
  .card:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--gold-dk), 0 1px 0 #0008;}
  .card .icon{font-size:24px;width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
    background:#150e08;border:2px solid var(--gold-dk);}
  .card .name{font-size:15px;letter-spacing:1px;}
  .card .name small{color:var(--gold);margin-left:6px;font-size:10px;}
  .card .desc{font-size:11px;color:var(--bone-dim);margin-top:3px;line-height:1.5;}

  #transition{background:#050408;}
  #transition .tTag{font-size:11px;letter-spacing:4px;color:var(--bone-dim);margin-bottom:10px;}
  #transition h2{font-size:clamp(26px,7vw,36px);letter-spacing:4px;color:var(--gold-hi);
    text-shadow:0 3px 0 #a05818, 0 5px 16px #ff9a3c55;}
  #transition .tSub{margin-top:14px;font-size:12px;color:var(--bone-dim);line-height:2;max-width:320px;}

  #dead{background:radial-gradient(100% 80% at 50% 0%, #2a1014 0%, #0c0709 60%);}
  #dead h2{font-size:32px;letter-spacing:4px;color:#ff6a58;margin-bottom:8px;text-shadow:2px 2px 0 #400, 0 0 24px #e0483866;}
  #dead .sub,#win .sub{font-size:12px;color:var(--bone-dim);line-height:2;margin-bottom:22px;}
  .stats{display:flex;gap:10px;margin-bottom:28px;}
  .stats .s{padding:10px 16px;text-align:center;min-width:86px;}
  .stats .v{font-size:22px;color:var(--gold-hi);text-shadow:2px 2px 0 #000;}
  .stats .k{font-size:9px;letter-spacing:2px;color:var(--bone-dim);margin-top:4px;}

  #win{background:radial-gradient(130% 100% at 50% 118%, #ffe0a0 -25%, #d87828 12%, #6a3818 45%, #16100e 100%);}
  #win .eyebrow{font-size:11px;letter-spacing:4px;color:#ffe0a0cc;margin-bottom:14px;}
  #win h2{font-size:clamp(32px,9vw,46px);letter-spacing:3px;color:#fff6e0;line-height:1.45;
    text-shadow:0 3px 0 #b06020, 0 0 34px #ffb45e99;margin-bottom:16px;}

  /* ====== 전투 화면 ====== */
  #battle{background:#0a0810;z-index:9;display:none;flex-direction:column;
    position:fixed;inset:0;padding:0;}
  #battle.show{display:flex;}
  #bScene{flex:1;position:relative;overflow:hidden;
    background:linear-gradient(180deg,var(--bSky1,#211f28) 0%,var(--bSky2,#141319) 62%,var(--bGround,#3e4432) 62.5%,var(--bGround2,#37402e) 100%);}
  #bScene .vign{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%, transparent 55%, #00000066 100%);}
  /* 같은 지면 위 좌우 대치 구도 */
  #bEnemyWrap{position:absolute;right:10%;bottom:30%;text-align:center;}
  #bEnemySpr{filter:drop-shadow(0 6px 0 rgba(0,0,0,0.35));}
  #bHeroWrap{position:absolute;left:10%;bottom:30%;}
  #bHeroSpr{filter:drop-shadow(0 5px 0 rgba(0,0,0,0.35));}
  #bVs{position:absolute;left:50%;bottom:44%;transform:translateX(-50%);
    font-size:20px;color:#ffffff2e;letter-spacing:2px;text-shadow:2px 2px 0 #0006;}
  .bTag{position:absolute;padding:6px 9px;min-width:150px;text-align:left;}
  #bHeroTag{left:8px;top:calc(8px + env(safe-area-inset-top));}
  #bEnemyTag{right:8px;top:calc(8px + env(safe-area-inset-top));text-align:right;}
  .bTag .nm{font-size:12px;letter-spacing:1px;color:var(--gold-hi);text-shadow:1px 1px 0 #000;}
  .bTag .nm small{color:var(--bone-dim);font-size:9px;margin-left:4px;}
  .bTag .bar{margin-top:4px;height:11px;}
  .bTag .fill{background:linear-gradient(180deg,#ff7a60,var(--hp) 60%,#a02818);width:100%;}
  .bTag .sub{margin-top:3px;font-size:9px;color:var(--bone-dim);}
  #bChargeMark{display:none;margin-top:3px;font-size:9px;color:#ff8a70;}
  #dodgeGame{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    display:none;flex-direction:column;align-items:center;gap:8px;z-index:3;}
  #dodgeGame .dgTxt{font-size:16px;color:var(--gold-hi);text-shadow:2px 2px 0 #000;
    animation:hlPulse 0.5s ease-in-out infinite;letter-spacing:2px;}
  #dgBar{position:relative;width:min(260px,70vw);height:26px;background:#120c08;
    border:3px solid var(--frame);box-shadow:inset 0 0 0 2px var(--gold-dk), 0 4px 0 #000a;}
  #dgGood{position:absolute;top:0;bottom:0;background:#3a6a5a;}
  #dgPerfect{position:absolute;top:0;bottom:0;background:#8ae8cc;box-shadow:inset 0 0 6px #fff8;}
  #dgMarker{position:absolute;top:-5px;bottom:-5px;width:5px;background:#fff;
    box-shadow:0 0 8px #fff;margin-left:-2px;}

  #bBottom{flex:none;background:linear-gradient(180deg,var(--panel),var(--panel-dk));
    border-top:3px solid var(--frame);
    box-shadow: inset 0 3px 0 var(--gold-dk), inset 0 5px 0 #00000044;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));}
  #bLog{min-height:38px;font-size:13px;line-height:1.55;color:var(--bone);
    padding:4px 6px 8px;text-shadow:1px 1px 0 #000;letter-spacing:0.5px;}
  #bLog em{font-style:normal;color:var(--gold-hi);}
  #bCmds{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .bcmd{font-family:'Galmuri11','DungGeunMo',sans-serif;font-size:16px;letter-spacing:1px;color:var(--bone);
    background:linear-gradient(180deg,#4a3828,#2e2018);
    border:2px solid var(--frame);
    box-shadow:inset 0 0 0 1px var(--gold-dk), inset 0 2px 0 #ffffff18, 0 3px 0 #0008;
    padding:13px 6px;cursor:pointer;}
  .bcmd:active{transform:translateY(2px);}
  .bcmd small{display:block;font-size:9px;color:var(--bone-dim);margin-top:3px;}
  .bcmd:disabled{opacity:0.45;}
  .bcmd.hl{border-color:var(--gold-hi);color:var(--gold-hi);
    box-shadow:inset 0 0 0 1px var(--gold), 0 0 14px #ff9a3c66, 0 3px 0 #0008;
    animation:hlPulse 1s ease-in-out infinite;}
  @keyframes hlPulse{0%,100%{box-shadow:inset 0 0 0 1px var(--gold), 0 0 8px #ff9a3c44, 0 3px 0 #0008;}
    50%{box-shadow:inset 0 0 0 1px var(--gold-hi), 0 0 18px #ff9a3c88, 0 3px 0 #0008;}}
  #spDots{display:inline-block;margin-left:6px;letter-spacing:2px;font-size:10px;color:var(--sp);}

  .popDmg{position:absolute;font-size:20px;color:#ffe0a0;text-shadow:2px 2px 0 #000;
    pointer-events:none;animation:popUp 0.7s ease-out forwards;}
  .popDmg.crit{color:#ff8a2a;font-size:26px;}
  .popDmg.heal{color:#8af0d0;}
  @keyframes popUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-42px);opacity:0;}}
  /* 대기 숨쉬기 */
  #bEnemyWrap{animation:idleBob 2.2s ease-in-out infinite;}
  #bHeroWrap{animation:idleBob 2.7s ease-in-out infinite;}
  @keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  /* 공격 돌진 */
  .lungeR{animation:lungeR .38s ease-out;}
  @keyframes lungeR{0%{transform:translateX(0);}32%{transform:translateX(74px);}55%{transform:translateX(74px);}100%{transform:translateX(0);}}
  .lungeL{animation:lungeL .38s ease-out;}
  @keyframes lungeL{0%{transform:translateX(0);}32%{transform:translateX(-74px);}55%{transform:translateX(-74px);}100%{transform:translateX(0);}}
  /* 참격 이펙트 */
  .slashFx{position:absolute;left:50%;top:38%;width:96px;height:7px;margin-left:-48px;
    background:linear-gradient(90deg,transparent,#ffffff,#ffd9a0,transparent);
    pointer-events:none;opacity:0;animation:slashA .26s ease-out forwards;}
  @keyframes slashA{0%{opacity:0;transform:rotate(-42deg) scaleX(.2);}
    30%{opacity:1;transform:rotate(-42deg) scaleX(1.15);}
    100%{opacity:0;transform:rotate(-42deg) scaleX(1.35);}}
  .slashFx.rev{animation:slashB .26s ease-out forwards;}
  @keyframes slashB{0%{opacity:0;transform:rotate(42deg) scaleX(.2);}
    30%{opacity:1;transform:rotate(42deg) scaleX(1.15);}
    100%{opacity:0;transform:rotate(42deg) scaleX(1.35);}}
  /* 처치 연출 */
  .dieFx{animation:dieA .7s ease-in forwards;}
  @keyframes dieA{0%{opacity:1;transform:none;}100%{opacity:0;transform:translateY(26px) rotate(16deg);}}
  .shakeX{animation:shakeX 0.3s;}
  @keyframes shakeX{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .flashW{animation:flashW 0.25s;}
  @keyframes flashW{0%,100%{filter:none;}50%{filter:brightness(3) drop-shadow(0 0 6px #fff);}}
  #bFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;}

  /* 한글 줄바꿈: 단어 단위(keep-all)로 예쁘게 */
  body,.ovDesc,.ovTitle,.sub,.lore,.card .desc,.card .name,#bLog,#evDesc,#tSub,.hint{
    word-break:keep-all;overflow-wrap:break-word;
  }
  .ovDesc,#evDesc{line-height:1.95;}
  .sub{line-height:2;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hudBox">
    <div id="lvBadge" class="panel"><div class="lv">LV</div><div class="n" id="lvNum">1</div></div>
    <div id="bars" class="panel">
      <div class="bar"><div class="fill" id="hpFill"></div><div class="txt" id="hpTxt">HP 100/100</div></div>
      <div class="bar"><div class="fill" id="xpFill"></div></div>
      <div id="quest"><small id="questTag">파수꾼</small><span id="questNum">북쪽 어딘가</span></div>
      <div id="invTag">🗝 0</div>
    </div>
  </div>
  <div id="relicBar"></div>
  <div id="equipBar"></div>
  <div id="relicTip" class="panel"></div>
</div>
<button id="actBtn" class="panel">조사하기</button>
<div id="tutMsg" class="panel"><span id="tutTxt"></span><button id="tutSkip">건너뛰기 ›</button></div>
<div id="mapLabel"></div>

<!-- ====== 전투 화면 ====== -->
<div id="battle">
  <div id="bScene">
    <div class="vign"></div>
    <div id="bEnemyWrap"><canvas id="bEnemySpr"></canvas></div>
    <div id="bHeroWrap"><canvas id="bHeroSpr"></canvas></div>
    <div id="bVs">VS</div>
    <div id="dodgeGame">
      <div class="dgTxt">탭!</div>
      <div id="dgBar"><div id="dgGood"></div><div id="dgPerfect"></div><div id="dgMarker"></div></div>
    </div>
    <div class="bTag panel" id="bEnemyTag">
      <div class="nm" id="bName">그림자 슬라임 <small id="bLvTxt"></small></div>
      <div class="bar"><div class="fill" id="bHpFill"></div></div>
      <div id="bChargeMark">▲ 힘을 모으고 있다!</div>
    </div>
    <div class="bTag panel" id="bHeroTag">
      <div class="nm"><span id="bHeroName">아렌</span> <small id="pLvTxt">LV 1</small></div>
      <div class="bar"><div class="fill" id="pHpFillB" style="background:linear-gradient(180deg,#ff7a60,var(--hp) 60%,#a02818)"></div></div>
      <div class="sub">SP<span id="spDots">●○○</span></div>
    </div>
  </div>
  <div id="bBottom">
    <div id="bLog">어둠이 움직인다…</div>
    <div id="bCmds"></div>
  </div>
</div>
<div id="bFlash"></div>

<div id="title" class="overlay show">
  <div class="eyebrow">도트 로그라이크 RPG</div>
  <h1>이그니스</h1>
  <div class="heroHead">캐릭터 선택</div>
  <div id="heroSelect"></div>
  <div id="heroDesc">균형 잡힌 능력치. 처음이라면 아렌.</div>

let AC=null,noiseBuf=null;
function ac(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null;}
}
function beep(freq,dur,type,vol,slideTo){
  const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,a.currentTime);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.04,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);
    o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
function noise(dur,vol,freq,type,q){
  const a=ac();if(!a)return;
  try{
    if(!noiseBuf){
      noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=a.createBiquadFilter();f.type=type||'bandpass';
    f.frequency.value=freq||1200;f.Q.value=q||1;
    const g=a.createGain();
    g.gain.setValueAtTime(vol||0.05,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    s.connect(f);f.connect(g);g.connect(a.destination);
    s.start();s.stop(a.currentTime+dur);
  }catch(e){}
}
function unlockAudio(){
  try{

    const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();
    s.buffer=b;s.connect(AC.destination);s.start(0);
  }catch(e){}
}

        g.fillStyle=H;g.fillRect(x,y,Math.min(2,w),1);

    }
    // 상단 총안(크레넬)
    g.clearRect(0,0,40,2);
    for(let x=0;x<40;x+=8){
      g.fillStyle=K;g.fillRect(x,0,5,3);
      g.fillStyle=S1;g.fillRect(x+1,1,3,2);

    const ox=9,ow=22,oy=8;

    g.fillStyle=S2;g.fillRect(ox-1,oy-1,3,3);g.fillRect(ox+ow-2,oy-1,3,3);
    g.fillStyle=S1;g.fillRect(ox-1,oy-1,2,2);g.fillRect(ox+ow-1,oy-1,2,2);
    if(open){
      g.fillStyle=D;g.fillRect(ox,oy,ow,21);
      // 바닥 문턱
      g.fillStyle=S1;g.fillRect(ox,28,ow,1);
    }else{
      // 나무 대문 두 짝 (세로 판자)
      for(let x=0;x<ow;x++){
        g.fillStyle=(x%3===2)?W2:W1;
        g.fillRect(ox+x,oy+1,1,20);
      }
      g.fillStyle=K;g.fillRect(ox+(ow>>1),oy+1,1,20); // 중앙 이음새
      // 철제 띠 + 리벳
      g.fillStyle=IR;g.fillRect(ox,oy+5,ow,2);g.fillRect(ox,oy+14,ow,2);
      g.fillStyle=H;
      g.fillRect(ox+2,oy+5,1,1);g.fillRect(ox+ow-3,oy+5,1,1);

   교체됨. h = 게임 내 표시 높이(px, 기본 50).

const SPRITE_OVERRIDES={

};
function loadOverrides(){
  for(const key in SPRITE_OVERRIDES){
    const conf=SPRITE_OVERRIDES[key];
    const url=typeof conf==='string'?conf:conf.url;
    if(!url)continue;
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      img._h=(typeof conf==='object'&&conf.h)||50; // 목표 표시 높이
      SPR[key]=img;
    };
    img.onerror=()=>{};
    img.src=url;
  }
}

];
let selHero=0;
const heroImgs=HERO_IMG_DATA.map(d=>{const im=new Image();im._h=50;im.src=d;return im;});
function buildHeroSelect(){
  const wrap=document.getElementById('heroSelect');
  if(!wrap)return;
  wrap.innerHTML='';
  HEROES.forEach((h,i)=>{
    const s=document.createElement('button');
    s.className='hSlot'+(i===selHero?' sel':'');
    s.innerHTML='<img src="'+HERO_IMG_DATA[i]+'"><div class="hn">'+h.name+'</div><div class="hc">'+h.cls+'</div>';
    s.onclick=()=>{selHero=i;buildHeroSelect();beep(600,0.06,'square',0.03);};
    wrap.appendChild(s);
  });
  const d=document.getElementById('heroDesc');
  if(d)d.textContent=HEROES[selHero].desc;
}

function randomBlessing(p){
  const pool=UPGRADES.filter(u=>(taken[u.id]||0)<u.max);
  if(!pool.length)return null;
  const u=pool[Math.floor(Math.random()*pool.length)];
  taken[u.id]=(taken[u.id]||0)+1;
  u.apply(p);
  return u;
}

function makeBoxIcon(c1,c2){
  try{
    const c=document.createElement('canvas');c.width=16;c.height=16;
    const g=c.getContext('2d');
    g.fillStyle='#16121a';g.fillRect(0,0,16,16);
    g.fillStyle=c1;g.fillRect(1,1,14,14);
    g.fillStyle=c2;g.fillRect(1,1,14,4);
    return c.toDataURL();
  }catch(e){return '';}
}

const EQ_NAMES={
  weapon:[['낡은 검','벼린 검','파수꾼의 검'],['금간 지팡이','참나무 지팡이','현자의 지팡이']],

  neck:[['구리 목걸이','은 목걸이','마력의 목걸이'],['이빨 목걸이','호박 목걸이','행운의 목걸이']],
};
function makeEquip(mi,forceGi){
  const slots=Object.keys(EQ_SLOTS);
  const slot=slots[Math.floor(Math.random()*slots.length)];
  let gi=forceGi;
  if(gi===undefined){const r=Math.random();gi=r<0.6?0:(r<0.9?1:2);}
  const G=EQ_GRADES[gi], P=G.mul*(1+mi*0.18);
  const iv=(a,b)=>Math.max(1,Math.round(rnd(a,b)*P));
  let mods={},reqK='STR',name='';
  if(slot==='weapon'){
    if(Math.random()<0.3){reqK='INT';mods={wMag:iv(3,5)};name=EQ_NAMES.weapon[1][gi];}
    else{reqK='STR';mods={wAtk:iv(2,4)};name=EQ_NAMES.weapon[0][gi];}
  }else if(slot==='top'){reqK='STR';mods={maxhp:iv(10,16)};name=EQ_NAMES.top[gi];}
  else if(slot==='bottom'){reqK='STR';mods={maxhp:iv(5,9),guard:0.02*G.mul};name=EQ_NAMES.bottom[gi];}
  else if(slot==='shoes'){reqK='DEX';mods={dodge:0.02*G.mul,combo:0.02*G.mul};name=EQ_NAMES.shoes[gi];}
  else if(slot==='cloak'){reqK=Math.random()<0.5?'DEX':'LUK';mods={guard:0.03*G.mul,dodge:0.01*G.mul};name=EQ_NAMES.cloak[gi];}
  else{
    if(Math.random()<0.5){reqK='INT';mods={maxmp:Math.round(rnd(2,3)*G.mul)};name=EQ_NAMES.neck[0][gi];}
    else{reqK='LUK';mods={crit:0.03*G.mul};name=EQ_NAMES.neck[1][gi];}
  }
  const req=gi===0?0:(gi===1?2+((mi-1)>>1):3+(mi>>1)); // 1맵: 고급2/희귀3 → 5맵: 고급4/희귀5
  const price=Math.round((20+mi*10)*G.mul);
  return {slot,gi,gname:G.g,gc:G.c,name,mods,reqK,req,price};
}
function eqDesc(it){
  const M={wAtk:v=>'물리 피해 +'+v, wMag:v=>'마법 피해 +'+v, maxhp:v=>'최대 HP +'+v,
    guard:v=>'받는 피해 -'+Math.round(v*100)+'%', dodge:v=>'회피 +'+Math.round(v*100)+'%',
    combo:v=>'연격 +'+Math.round(v*100)+'%', crit:v=>'치명타 +'+Math.round(v*100)+'%',
    maxmp:v=>'최대 MP +'+v};
  return Object.entries(it.mods).map(([k,v])=>M[k]?M[k](v):'').filter(Boolean).join(' · ');
}
function eqApply(it,dir){
  for(const k in it.mods){
    const v=it.mods[k]*dir;
    if(k==='maxhp'){player.maxhp+=v;if(dir<0)player.hp=Math.min(player.hp,player.maxhp);}
    else player[k]=(player[k]||0)+v;
  }
}
function canEquip(it){return !it.req||player[it.reqK]>=it.req;}
function equipItem(it){
  const cur=player.equip[it.slot];
  if(cur){eqApply(cur,-1);INV.gold+=Math.round(cur.price/2);}
  eqApply(it,1);
  player.equip[it.slot]=it;
  updateEquipBar();updateHUD();
  return cur;
}
function updateEquipBar(){
  const bar=$('equipBar');if(!bar)return;
  const items=Object.values(player.equip||{});
  bar.innerHTML=items.map(it=>
    '<span class="eqChip" style="color:'+it.gc+'" data-eq="'+it.slot+'"><img src="'+eqIconOf(it)+'" style="width:11px;height:11px;image-rendering:pixelated;vertical-align:-2px;pointer-events:none"> '+it.name+'</span>'
  ).join('');
}
function showEquipGain(it,src){
  state='event';sfx.relic();

  const wrap=$('evChoices');wrap.innerHTML='';

  w.innerHTML='<div class="icon">'+(ok?'✅':'🔒')+'</div><div><div class="name">'

    +'</div><div class="desc">'+(ok?'':(STATK[it.reqK]+' '+it.req+' 필요'))+'</div></div>';
  w.onclick=()=>{
    equipItem(it);sfx.relic();

  wrap.appendChild(w);

  s.innerHTML='<div class="icon">🪙</div><div><div class="name">판다 <small>+'+it.price+'G</small></div><div class="desc"></div></div>';

  showOverlay('event');
}
let relics=[];
function grantRelic(){
  const pool=RELICS.filter(r=>!relics.includes(r.key));
  if(!pool.length)return null;
  const r=pool[Math.floor(Math.random()*pool.length)];
  relics.push(r.key);
  r.apply(player);
  updateRelicBar();updateHUD();
  sfx.item();
  return r;
}
function updateRelicBar(){
  const bar=document.getElementById('relicBar');
  if(!bar)return;
  bar.innerHTML=relics.map(k=>{
    const r=RELICS.find(x=>x.key===k);
    return '<img src="'+ITEM_IMG[k]+'" title="'+r.name+' — '+r.desc+'" data-k="'+k+'">';
  }).join('');
}
let relicTipT=null;
function showRelicTip(key,x,y){
  const r=RELICS.find(v=>v.key===key);

  const tip=$('relicTip');

  tip.style.left=Math.min(window.innerWidth-240,Math.max(8,x-40))+'px';

}

let mapTree=null,mapPillar=null,mapRock=null;
function makeGroundPattern(m){
  const t=document.createElement('canvas');
  const cell=16;
  t.width=cell*2*S; t.height=cell*2*S;
  const g=t.getContext('2d');
  g.imageSmoothingEnabled=false;
  for(let ty=0;ty<2;ty++)for(let tx=0;tx<2;tx++){
    g.fillStyle=(tx+ty)%2?m.ground2:m.ground;
    g.fillRect(tx*cell*S,ty*cell*S,cell*S,cell*S);
  }
  for(let i=0;i<26;i++){
    g.fillStyle=Math.random()<0.5?m.detail:m.ground2;
    const x=Math.floor(Math.random()*cell*2)*S, y=Math.floor(Math.random()*cell*2)*S;
    g.fillRect(x,y,S,S);
    if(Math.random()<0.3)g.fillRect(x,y-S,S,S);
  }
  return cx.createPattern(t,'repeat');
}
function genMap(mi){
  const m=MAPS[mi];
  groundPat=makeGroundPattern(m);
  buildGateSprites(m.gate);
  mapTree=mapSprite(TREE_ROWS,m.tree);
  const rockRows = m.rockStyle==='ice'?ICE_ROWS : m.rockStyle==='spike'?SPIKE_ROWS : ROCK_ROWS;
  const rockPal = m.rockStyle==='ice'
    ? {k:'#1a2a3a',g:'#7aa8cc',h:'#c8e4f4',H:'#e8f4fc',G:'#4a7898'}
    : m.rockStyle==='spike'
    ? {k:'#141020',g:'#3a2e4e',h:'#5c4a78',H:'#7a62a0',G:'#241c36'}
    : {k:m.tree.k,g:m.detail,h:'#ffffff22',H:'#ffffff33',G:m.ground2};
  mapRock=mapSprite(rockRows,rockPal);
  mapPillar=mapSprite(PILLAR_ROWS,{k:m.tree.k,g:m.detail,h:'#ffffff26'});
  obstacles=[];
  let guard=0;
  while(obstacles.length<m.obstacles&&guard++<900){
    const kind=Math.floor(Math.random()*3);
    const o={x:rnd(90,WW-90),y:rnd(320,WH-380),r:kind===0?20:(kind===1?18:16),k:kind};
    if(dist2(o.x,o.y,WW/2,WH-220)<330*330)continue;
    if(o.y<440&&Math.abs(o.x-WW/2)<230)continue;
    let ok=true;
    for(const q of obstacles)if(dist2(o.x,o.y,q.x,q.y)<(o.r+q.r+70)*(o.r+q.r+70)){ok=false;break;}
    if(ok)obstacles.push(o);
  }
  decor=[];
  for(let i=0;i<90;i++)decor.push({x:rnd(0,WW),y:rnd(0,WH),k:Math.floor(Math.random()*2)});
  monsters=[];
  const scale=m.tutorial?0.7:1+Math.max(0,mi-1)*0.48;
  for(const [kind,count] of m.monsters){
    for(let i=0;i<count;i++){
      let x,y,g2=0;
      do{x=rnd(80,WW-80);y=rnd(280,WH-620);g2++;}
      while(g2<80&&(dist2(x,y,WW/2,WH-220)<460*460||hitObstacle(x,y,22)));
      monsters.push(makeMonster(kind,x,y,scale));
    }
  }
  warden=null;boss=null;trial=null;
  // 희귀몹: 왕관 슬라임 (40% 확률로 1마리 서식)
  if(!m.boss&&!m.tutorial&&Math.random()<0.4){
    let kx,ky,gk=0;
    do{kx=rnd(120,WW-120);ky=rnd(300,WH-700);gk++;}
    while(gk<60&&(dist2(kx,ky,WW/2,WH-220)<500*500||hitObstacle(kx,ky,22)));
    monsters.push(makeMonster('king',kx,ky,scale));
  }
  if(m.tutorial){
    monsters.push(makeMonster('slime',WW/2-150,WH-820,0.7));
    monsters.push(makeMonster('slime',WW/2+200,WH-1080,0.7));
  }else if(m.boss){
    boss=makeMonster('boss',WW/2,460,1);
    monsters.push(boss);
  }else{
    warden=makeMonster(m.wardenType||'warden',WW/2+rnd(-260,260),rnd(400,560),scale);
    monsters.push(warden);
  }
  tents=[];
  if(m.tutorial){
    tents.push({x:WW/2+240,y:WH-1350,ev:EVPOOL.find(e=>e.id==='camp'),used:false,lock:false});
  }
  const pool=[...EVPOOL];
  const tentN=m.tutorial?0:(m.boss?1:2);
  for(let i=0;i<tentN;i++){
    let ev;
    if(m.boss)ev=pool.find(e=>e.id==='camp');
    else ev=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let x,y,g3=0;
    do{x=rnd(120,WW-120);y=rnd(430,WH-520);g3++;}
    while(g3<80&&(dist2(x,y,WW/2,WH-220)<430*430||hitObstacle(x,y,46)
      ||tents.some(t=>dist2(x,y,t.x,t.y)<600*600)
      ||(warden&&dist2(x,y,warden.x,warden.y)<260*260)));
    tents.push({x,y,ev,used:false,lock:false});
  }
  // 상점: 천막 랜덤 이벤트 (1맵 0% / 2맵 30% / 3맵 60%·그때까지 미등장이면 확정 / 이후 60%)
  if(!m.tutorial&&tents.length){
    const chance = mi<=1?0 : mi===2?0.3 : (shopSeen?0.6:1);
    if(Math.random()<chance){
      const t=tents[Math.floor(Math.random()*tents.length)];
      t.shop=true;t.ev=null;t.stock=makeStock(mi);
      shopSeen=true;
    }else if(mi>=2){
      shopSeen=false; // 이번 맵에 안 떴으면 다음 맵 확정
    }
  }
  chests=[];
  if(m.tutorial){
    chests.push({x:WW/2-320,y:WH-1520,sprKey:'mChestB',used:false,near:false});
  }else if(!m.boss){
    const cn=1+(Math.random()<0.5?1:0);
    for(let i=0;i<cn;i++){
      let x,y,g4=0;
      do{x=rnd(120,WW-120);y=rnd(430,WH-520);g4++;}
      while(g4<80&&(dist2(x,y,WW/2,WH-220)<430*430||hitObstacle(x,y,46)
        ||tents.some(t=>dist2(x,y,t.x,t.y)<420*420)
        ||chests.some(c=>dist2(x,y,c.x,c.y)<520*520)
        ||(warden&&dist2(x,y,warden.x,warden.y)<260*260)));
      chests.push({x,y,sprKey:Math.random()<0.5?'mChestA':'mChestB',used:false,near:false});
    }
  }
  traps=[];arrows=[];keyDropped=false;
  if(!m.tutorial&&!m.boss){
    const tn=2+(Math.random()<0.5?1:0);
    let g6=0;
    while(traps.length<tn&&g6++<120){
      const x=rnd(140,WW-140),y=rnd(560,WH-620);
      if(dist2(x,y,WW/2,WH-220)<520*520)continue;
      if(hitObstacle(x,y,30))continue;
      if(tents.some(t=>dist2(x,y,t.x,t.y)<240*240))continue;
      if(chests.some(c=>dist2(x,y,c.x,c.y)<240*240))continue;
      if(traps.some(t=>dist2(x,y,t.x,t.y)<420*420))continue;
      traps.push({x,y,cd:rnd(0,1),tele:0,aim:0});
    }
  }
  gate={x:WW/2,y:120,w:160,open:false};
  obstacles.push({x:gate.x-62,y:gate.y+34,r:30,k:0,hidden:true});
  obstacles.push({x:gate.x+62,y:gate.y+34,r:30,k:0,hidden:true});
  obstacles.push({x:gate.x,y:gate.y+26,r:40,k:0,hidden:true,door:true});
}
function makeMonster(kind,x,y,scale){
  const T=ETYPE[kind];
  return {kind,x,y,r:T.r,
    hp:T.boss?T.hp:Math.round(T.hp*scale),maxhp:T.boss?T.hp:Math.round(T.hp*scale),
    atk:Math.round(T.atk*(1+(scale-1)*0.52)),xp:Math.round(T.xp*(1+(scale-1)*0.65)),
    sp:T.sp,spr:T.spr,fly:!!T.fly,elite:!!T.elite,boss:!!T.boss,hound:!!T.hound,king:!!T.king,mimic:!!T.mimic,champ:!!T.champ,
    name:T.name,chargeP:T.chargeP||0.15,edodge:T.dodge||0,eguard:T.guard||0,drops:!!T.drops,
    st:'idle',stT:rnd(0.5,2),wx:0,wy:0,
    aggro:false,alertT:0,animT:rnd(0,9),flip:Math.random()<0.5,stunT:0};
}
function hitObstacle(x,y,r){
  for(const o of obstacles){
    const rr=o.r+r;
    if(dist2(x,y,o.x,o.y)<rr*rr)return o;
  }
  return null;
}
function repelProps(e){
  for(const t of tents){
    const d=Math.hypot(e.x-t.x,e.y-t.y);
    if(d<=0.01){e.x=t.x+110;continue;}
    if(d<110){e.x+=(e.x-t.x)/d*(110-d);e.y+=(e.y-t.y)/d*(110-d);}
  }
  for(const c of chests){
    const d=Math.hypot(e.x-c.x,e.y-c.y);
    if(d<=0.01){e.x=c.x+95;continue;}
    if(d<95){e.x+=(e.x-c.x)/d*(95-d);e.y+=(e.y-c.y)/d*(95-d);}
  }
}
function resolveObstacles(e){
  for(const o of obstacles){
    if(o.door&&gate&&gate.open)continue;
    const rr=o.r+e.r;
    const d2=dist2(e.x,e.y,o.x,o.y);
    if(d2<rr*rr&&d2>0.01){
      const d=Math.sqrt(d2);
      e.x=o.x+(e.x-o.x)/d*rr;
      e.y=o.y+(e.y-o.y)/d*rr;
    }
  }
  e.x=clamp(e.x,e.r,WW-e.r);
  e.y=clamp(e.y,e.r,WH-e.r);
}

let stick=null;
function stickVec(){
  if(stick){
    let dx=stick.x-stick.ox,dy=stick.y-stick.oy;
    const d=Math.hypot(dx,dy);
    if(d<8)return[0,0];
    const m=Math.min(d,52)/52;
    return[dx/d*m,dy/d*m];
  }
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['arrowright'])dx+=1;
  if(keys['w']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['arrowdown'])dy+=1;
  const d=Math.hypot(dx,dy)||1;
  return[dx/d*(dx||dy?1:0),dy/d*(dx||dy?1:0)];
}
cv.addEventListener('touchstart',e=>{

  e.preventDefault();
  if(state!=='play')return;
  const t=e.changedTouches[0];
  if(!stick)stick={ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY,id:t.identifier};
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!stick)return;
  for(const t of e.changedTouches)if(t.identifier===stick.id){stick.x=t.clientX;stick.y=t.clientY;}
},{passive:false});
const endT=e=>{if(!stick)return;for(const t of e.changedTouches)if(t.identifier===stick.id)stick=null;};

function renderCmds(mode){
  const c=$('bCmds');c.innerHTML='';
  if(!battle)return;
  const allow = (battle.tut&&battle.tphase<4)?[['a'],['d'],['s'],['i']][battle.tphase]:null;
  const mk=(key,html,fn,dis)=>{
    const b=document.createElement('button');
    b.className='bcmd'+(allow&&allow.includes(key)?' hl':'');
    b.innerHTML=html;
    b.disabled=!!dis||(allow&&!allow.includes(key));
    b.onclick=()=>{if(battle&&!battle.busy&&!battle.over)fn();};
    c.appendChild(b);
  };
  if(mode==='magic'){
    SKILLS.forEach((sk,i)=>{
      const locked=player.INT<sk.req;
      mk('m',sk.icon+' '+sk.name+'<small>'+(locked?('🔒 지능 '+sk.req+' 필요'):('MP '+sk.cost+' · '+sk.d(player)))+'</small>',
        ()=>cmdMagic(i),locked||player.mp<sk.cost);
    });
    mk('b','↩ 돌아가기<small></small>',()=>renderCmds());
    return;
  }
  if(mode==='item'){
    for(const k of ['red','purple','elixir','blue']){
      const it=ITEMS[k];
      mk('i','<img src="'+ITEM_IMG[k]+'" style="width:22px;height:22px;vertical-align:-5px;image-rendering:pixelated"> '
        +it.name+' ×'+INV[k]+'<small>'+it.desc+'</small>',()=>useItem(k),INV[k]<=0);
    }
    mk('b','↩ 돌아가기<small></small>',()=>renderCmds(),battle.tut&&battle.tphase===3);
    return;
  }
  const pLo=Math.round((7+player.STR+player.DEX+(player.wAtk||0))*player.dmgMul);
  const pHi=Math.round((7+player.STR*4+player.DEX*2+(player.wAtk||0))*player.dmgMul);
  mk('a','⚔ 공격<small>피해 '+pLo+'~'+pHi+' · SP +1</small>',()=>cmdAttack());
  const sm=2*(player.smashMul||1);
  mk('s','💥 강타<small>SP 2 · 피해 '+Math.round(pLo*sm)+'~'+Math.round(pHi*sm)+'</small>',()=>cmdSmash(),battle.sp<2);
  mk('m','🔮 마법<small>'+(player.INT>=2?('스킬 사용 · MP '+Math.floor(player.mp)+'/'+player.maxmp):'🔒 지능 2 이상 필요')+'</small>',()=>renderCmds('magic'),player.INT<2);
  mk('d','🌀 회피<small>다음 공격을 흘린다</small>',()=>cmdDodge());
  mk('i','🎒 아이템<small>물약 '+(INV.red+INV.purple+INV.elixir+INV.blue)+'개 보유</small>',()=>renderCmds('item'));
  const noFlee=battle.e.boss||battle.e.elite||battle.e.hound;
  mk('f','🏃 도망<small>'+(noFlee?'도망칠 수 없다!':'전투에서 이탈')+'</small>',()=>cmdFlee(),noFlee);
}
/* --- 플레이어 행동 --- */
function playerHitEnemy(mul,label){
  const p=player;
  const crit=Math.random()<p.crit+p.LUK*0.035;
  let dmg=physRoll()*mul*battle.buff*(crit?(2+p.LUK*0.06):1);
  // 적 회피/가드
  if(Math.random()<battle.e.edodge){
    popDmg('enemy','MISS');
    bLog('<em>'+battle.e.name+'</em>이(가) 재빠르게 피했다!');
    return 0;
  }
  dmg*=(1-battle.e.eguard)*(1-(battle.bossGuard||0));
  dmg=Math.max(1,Math.round(dmg));
  battle.ehp-=dmg;
  if(battle.tut&&battle.tphase<4&&battle.ehp<1)battle.ehp=1;
  if(p.lifesteal>0){p.hp=Math.min(p.maxhp,p.hp+dmg*p.lifesteal);}
  popDmg('enemy',dmg,crit?'crit':'');
  slashFx('enemy');
  shake('enemy',true);
  if(crit)sfx.crit();else sfx.slash();
  bLog((label||'베었다!')+' <em>'+dmg+'</em> 피해'+(crit?' — <em>치명타!</em>':''));
  if(p.burnLv>0)battle.burn=2;
  return dmg;
}
function cmdAttack(){
  battle.busy=true;
  battle.sp=Math.min(player.maxsp,battle.sp+1);
  lunge('hero');
  playerHitEnemy(1);
  updateBattleUI();
  // 연격
  const chain=()=>{
    if(battle.ehp<=0){victory();return;}
    if(Math.random()<player.combo+player.DEX*0.03){
      setTimeout(()=>{
        playerHitEnemy(0.7,'연격이 터졌다!');
        updateBattleUI();
        if(battle.ehp<=0){victory();return;}
        setTimeout(enemyTurn,620);
      },380);
    } else setTimeout(enemyTurn,620);
  };
  chain();
}

function cmdMagic(i){
  const sk=SKILLS[i||0];
  const p=player;
  if(!sk||p.INT<sk.req||p.mp<sk.cost)return;
  battle.busy=true;
  p.mp-=sk.cost;
  const crit=Math.random()<(p.crit+p.LUK*0.035)*(sk.critx||1);
  let dmg=Math.round((sk.roll(p)+(p.wMag||0))*p.dmgMul*(crit?(2+p.LUK*0.06):1)*battle.buff*(1-(battle.e.eguard||0)));
  dmg=Math.max(1,dmg);
  battle.ehp-=dmg;
  if(battle.tut&&battle.tphase<4&&battle.ehp<1)battle.ehp=1;
  if(sk.weak)battle.eWeak=sk.weak;
  if(sk.burn)battle.burn=sk.burn;
  popDmg('enemy',dmg,crit?'crit':'');
  slashFx('enemy');shake('enemy',true);
  sfx.magic();
  bLog(sk.icon+' <em>'+sk.name+'</em>! '+(crit?'<em>치명타!</em> ':'')+'<em>'+dmg+'</em> 피해'
    +(sk.weak?' · 적이 움츠러든다':'')+(sk.burn?' · <em>화상</em>':''));

}

/* --- 적 턴 --- */
function enemyTurn(){
  if(!battle||battle.over)return;
  const e=battle.e,p=player;
  // 화상 처리
  if(battle.burn>0){
    const bd=Math.max(2,Math.round(pAtk()*0.25*p.burnLv));
    battle.ehp-=bd;battle.burn--;
    popDmg('enemy',bd,'crit');
    bLog('🔥 화상! <em>'+bd+'</em> 피해');
    updateBattleUI();
    if(battle.ehp<=0){victory();return;}
    setTimeout(()=>enemyAct(),560);
  } else enemyAct();
}
function enemyAct(){
  const e=battle.e,p=player;
  battle.turnN=(battle.turnN||0)+1;
  /* --- 훈련 전투: 단계별 고정 행동 --- */
  if(battle.tut&&battle.tphase<4){
    if(battle.tphase===0){
      battle.charge=true;
      $('bChargeMark').style.display='block';
      bLog('<em>'+e.name+'</em>이(가) 힘을 모은다…!');
      beep(110,0.25,'sawtooth',0.05);
      setTimeout(endEnemyTurn,750);
      return;
    }
    if(battle.tphase===1){
      battle.charge=false;
      $('bChargeMark').style.display='none';
      dealToPlayer(e.atk*2.0,'<em>'+e.name+'</em>의 필살의 일격!',true);
      return;
    }
    if(battle.tphase===2){dealToPlayer(14,'<em>'+e.name+'</em>의 매서운 반격!');return;}
    if(battle.tphase===3){dealToPlayer(e.atk,'<em>'+e.name+'</em>의 공격!');return;}
  }
  /* 왕관 슬라임: 3번째 턴에 도주 — 그 전에 잡아라! */
  if(e.king){
    if(battle.turnN>=3){
      battle.over=true;
      bLog('<em>왕관 슬라임</em>은 폴짝폴짝 어둠 속으로 사라졌다…');
      sfx.flee();
      $('bEnemySpr').style.opacity=0.15;
      setTimeout(()=>endBattle('eflee'),900);
      return;
    }
    dealToPlayer(e.atk,'<em>'+e.name+'</em>의 몸통 박치기!');
    return;
  }
  if(battle.charge){
    battle.charge=false;
    $('bChargeMark').style.display='none';
    dealToPlayer(e.atk*2.2,'<em>'+e.name+'</em>의 필살의 일격!',true);
    return;
  }
  /* --- 보스 3페이즈 패턴 --- */
  if(e.boss){
    const r=battle.ehp/e.maxhp;
    const ph=r>0.66?1:(r>0.33?2:3);
    if(ph!==(battle.bossPh||1)){
      battle.bossPh=ph;
      if(ph===2){e.atk=Math.round(e.atk*1.25);bLog('심장이 검게 요동친다 — <em>2페이즈</em>! (공격 강화)');}
      if(ph===3){e.atk=Math.round(e.atk*1.3);battle.bossGuard=0.15;bLog('핵이 드러난다 — <em>마지막 페이즈</em>! (공격·방어 강화)');}
      sfx.boss();shake('enemy');
      setTimeout(endEnemyTurn,850);
      return;
    }
    battle.bossPh=ph;
    battle.bossT=(battle.bossT||0)+1;
    const pat = ph===1?[0,0,1] : ph===2?[0,1,2] : [1,2,2];
    const act=pat[battle.bossT%pat.length];
    if(act===1){
      battle.charge=true;
      $('bChargeMark').style.display='block';
      bLog('<em>어둠의 심장</em>이 힘을 모은다…!');
      beep(90,0.3,'sawtooth',0.06);
      setTimeout(endEnemyTurn,750);
      return;
    }
    if(act===2){
      dealToPlayer(e.atk*1.5,'<em>어둠의 파동</em>이 덮친다!',true);
      return;
    }
  }
  if(Math.random()<e.chargeP){
    battle.charge=true;
    $('bChargeMark').style.display='block';
    bLog('<em>'+e.name+'</em>이(가) 힘을 모은다…!');
    beep(110,0.25,'sawtooth',0.05);
    setTimeout(endEnemyTurn,650);
    return;
  }
  dealToPlayer(e.atk,'<em>'+e.name+'</em>의 공격!');
}
function dealToPlayer(raw,label,charged){
  const p=player;
  if(battle.eWeak){raw*=(1-battle.eWeak);battle.eWeak=0;}
  if(battle.dodging){
    battle.dodging=false;
    runDodgeGame(raw,label,charged);
    return;
  }
  if(!(battle.tut&&battle.tphase<4)&&Math.random()<p.dodge+p.DEX*0.03){
    popDmg('hero','MISS');
    bLog(label+' — 몸이 먼저 반응했다!');
    beep(500,0.06,'square',0.03);
    setTimeout(endEnemyTurn,620);
    return;
  }
  applyEnemyHit(raw,label,1,'');
}
function applyEnemyHit(raw,label,mult,suffix){
  const p=player;
  let dmg=Math.max(1,Math.round(raw*rnd(0.9,1.1)*(1-p.guard)*mult));
  lunge('enemy');
  p.hp-=dmg;
  popDmg('hero',dmg);
  slashFx('hero');
  shake('hero');
  sfx.hurt();
  bLog(label+suffix+' <em>'+dmg+'</em> 피해');
  updateBattleUI();
  if(p.hp<=0){
    p.hp=0;updateBattleUI();
    battle.over=true;
    bLog('쓰러졌다…');
    setTimeout(()=>{closeBattleUI();die();},900);
    return;
  }
  setTimeout(endEnemyTurn,620);
}
/* --- 회피 미니게임: 마커가 지날 때 탭! --- */
let dodgeRun=null;
function runDodgeGame(raw,label,charged){
  const p=player;
  const tut=battle&&battle.tut;
  const half=(tut?0.19:0.08)+(p.dodgeZone||0)+p.DEX*0.012;
  const zone={p1:0.5-half,p2:0.5+half,g1:0.22,g2:0.78};
  dodgeRun={raw,label,zone,charged:!!charged,pos:0,dir:1,passes:3,
    dur:tut?rnd(1.7,2.2):rnd(0.6,1.3),done:false,tPrev:performance.now()};
  $('dgPerfect').style.left=(zone.p1*100)+'%';
  $('dgPerfect').style.width=((zone.p2-zone.p1)*100)+'%';
  $('dgGood').style.left=(zone.g1*100)+'%';
  $('dgGood').style.width=((zone.g2-zone.g1)*100)+'%';
  $('dgMarker').style.left='0%';
  $('dodgeGame').style.display='flex';
  bLog(label+' — <em>흰 칸</em>에서 화면을 탭!');
  dodgeRun.iv=setInterval(()=>{
    if(!dodgeRun)return;
    const now=performance.now();
    const dt=(now-dodgeRun.tPrev)/1000;dodgeRun.tPrev=now;
    dodgeRun.pos+=dodgeRun.dir*dt/dodgeRun.dur;
    if(dodgeRun.pos>=1){dodgeRun.pos=1;dodgeRun.dir=-1;dodgeRun.passes--;dodgeRun.dur=rnd(0.6,1.3);}
    else if(dodgeRun.pos<=0){dodgeRun.pos=0;dodgeRun.dir=1;dodgeRun.passes--;dodgeRun.dur=rnd(0.6,1.3);}
    $('dgMarker').style.left=(Math.max(0,Math.min(1,dodgeRun.pos))*100)+'%';
    if(dodgeRun.passes<=0)resolveDodgeAt(-1);
  },16);
}
function resolveDodgeAt(pos){
  if(!dodgeRun||dodgeRun.done)return;
  dodgeRun.done=true;
  clearInterval(dodgeRun.iv);
  $('dodgeGame').style.display='none';
  const {raw,label,zone,charged}=dodgeRun;
  dodgeRun=null;
  const p=player;
  if(charged){
    if(pos>=zone.p1&&pos<=zone.p2){
      battle.sp=Math.min(p.maxsp,battle.sp+1);
      sfx.perfect();
      applyEnemyHit(raw,label,0.4,' — <em>충격파</em>만 스쳤다! 피해 60% 상쇄 (SP +1)');
      return;
    }
    if(pos>=zone.g1&&pos<=zone.g2){
      applyEnemyHit(raw,label,0.7,' — 몸을 던졌지만 <em>충격파</em>에 휘말렸다 (30% 상쇄)');
      return;
    }
    applyEnemyHit(raw,label,1,' — 정통으로 맞았다!');
    return;
  }
  if(pos>=zone.p1&&pos<=zone.p2){
    popDmg('hero','회피!','heal');
    battle.sp=Math.min(p.maxsp,battle.sp+1);
    sfx.perfect();
    let extra='';
    if(p.counter>0){
      const cd=Math.max(1,Math.round(physRoll()*p.counter));
      battle.ehp-=cd;
      if(battle.tut&&battle.tphase<4&&battle.ehp<1)battle.ehp=1;
      popDmg('enemy',cd,'crit');
      slashFx('enemy');shake('enemy',true);
      extra=' 되받아쳐 <em>'+cd+'</em> 피해!';
      updateBattleUI();
      if(battle.ehp<=0){
        bLog('<em>완벽한 회피!</em>'+extra);
        victory();return;
      }
    }
    bLog('<em>완벽한 회피!</em> (SP +1)'+extra);
    updateBattleUI();
    setTimeout(endEnemyTurn,700);
    return;
  }
  if(pos>=zone.g1&&pos<=zone.g2){
    applyEnemyHit(raw,label,0.2,' — 몸을 비틀어 흘렸다! <em>피해 80%↓</em>');
    return;
  }
  const oops=Math.random()<0.12?' — 멋지게 굴렀다. …그리고 정통으로 맞았다.':' — 타이밍을 놓쳤다!';
  applyEnemyHit(raw,label,1,oops);
}
function endEnemyTurn(){
  if(!battle||battle.over)return;
  player.mp=Math.min(player.maxmp,player.mp+player.INT*0.33); // 턴당 MP 회복 (지능×0.33)
  if(player.pBurnT>0){
    player.pBurnT--;
    player.hp-=4;
    popDmg('hero',4);
    bLog('화상이 아리다… <em>-4</em>'+(player.pBurnT>0?' ('+player.pBurnT+'턴 남음)':' (회복됨)'));
    updateBattleUI();
    if(player.hp<=0){
      player.hp=0;battle.over=true;
      bLog('쓰러졌다…');
      setTimeout(()=>{closeBattleUI();die();},900);
      return;
    }
  }
  if(battle.tut&&battle.tphase<4){
    battle.tphase++;
    setTimeout(tutTip,80);
    battle.busy=false;
    renderCmds();
    return;
  }
  if(battle.dodging){
    battle.dodging=false;
    bLog($('bLog').innerHTML+' <em>…허공에 힘을 뺐다.</em>');
  }
  battle.busy=false;
  renderCmds();
}
/* --- 전투 종료 --- */
function victory(){
  battle.over=true;
  const e=battle.e;
  sfx.vict();
  shake('enemy',true);
  $('bEnemySpr').classList.remove('lungeL','lungeR');
  $('bEnemySpr').classList.add('dieFx');
  kills++;
  if(e.boss){ // 심장이 멎는 즉시 필드 정리 (연출 지연과 무관)
    monsters.length=0;
    for(const t of tents)t.used=true;
    for(const c of chests)c.used=true;
    traps.length=0;
  }
  // 아이템 드랍 (낮은 확률)
  let dropTxt='';
  const roll=Math.random();
  if(e.king){ const gg=Math.round(rnd(60,150)*(1+mapIdx*0.4)); INV.gold+=gg; sfx.coin(); dropTxt=' · 👑 금화 <em>'+gg+'</em> 획득!'; }
  else if(e.mimic){ const rl=grantRelic(); if(rl){dropTxt=' · 🏺 유물 ['+rl.name+']!';}else{INV.elixir++;dropTxt=' · 진홍 엘릭서 획득!';} }
  else if(e.drops){ const rl=grantRelic(); if(rl){dropTxt=' · 🏺 유물 ['+rl.name+']!';}else{INV.elixir++;dropTxt=' · 진홍 엘릭서 획득!';} }
  else if(e.hound){ INV.red++; dropTxt=' · 붉은 물약 획득!'; }
  else {
    if(roll<0.13){INV.red++;dropTxt=' · 붉은 물약 획득!';}
    else if(roll<0.14){INV.purple++;dropTxt=' · 보랏빛 물약 획득!';}
    else if(roll<0.16){INV.elixir++;dropTxt=' · 진홍 엘릭서 획득!';}
    else if(roll<0.22){INV.blue++;dropTxt=' · 푸른 물약 획득!';}
    if(!keyDropped&&Math.random()<0.05+(player.keyBonus||0)){keyDropped=true;INV.key++;sfx.key();dropTxt+=' · 🗝 열쇠 획득!';}
  }
  const gold=e.kind&&ETYPE[e.kind]&&ETYPE[e.kind].gold?Math.max(1,Math.round(ETYPE[e.kind].gold*(1+mapIdx*0.45)*rnd(0.8,1.3))):0;
  if(gold>0){INV.gold+=gold;dropTxt+=' · 🪙 '+gold;sfx.coin();}
  if(dropTxt)sfx.item();
  if(!e.boss){ // 보스 처치는 게임 종료 — 회복 없음
    if(player.victHeal)player.hp=Math.min(player.maxhp,player.hp+player.victHeal); // 유물/특성 효과만
    player.mp=Math.min(player.maxmp,player.mp+player.INT); // 승리 시 지능당 MP 1 회복
  }
  bLog('<em>'+e.name+'</em>을(를) 물리쳤다! EXP <em>+'+e.xp+'</em>'+dropTxt);
  setTimeout(()=>endBattle('win'),1000);
}
function closeBattleUI(){
  $('bEnemySpr').style.opacity=1;
  $('bEnemySpr').classList.remove('dieFx','lungeL','lungeR');
  $('bHeroSpr').classList.remove('lungeR','lungeL');
  $('battle').classList.remove('show');
}
function endBattle(result){
  const e=battle.e;
  const wasBoss=e.boss, wasWarden=(e===warden), wasHound=e.hound;
  const xp=e.xp;
  closeBattleUI();
  battle=null;
  encCd=2.2; // 전투 후 잠깐 인카운터 면역 (도망 타이밍)
  if(result==='win'){
    const i=monsters.indexOf(e);
    if(i>=0)monsters.splice(i,1);
    for(let k=0;k<12;k++)parts.push({x:e.x,y:e.y-e.r,vx:rnd(-150,150),vy:rnd(-150,150),t:rnd(0.3,0.7),c:'#8a80b8',r:rnd(2,4)});
    if(wasWarden){
      warden=null;gate.open=true;
      $('questTag').textContent='문이 열렸다';
      $('questNum').textContent='북쪽으로!';
      sfx.gate();
    }
    if(wasBoss){
      boss=null;
      for(const mm of monsters)for(let k=0;k<6;k++)parts.push({x:mm.x,y:mm.y-mm.r,vx:rnd(-120,120),vy:rnd(-120,120),t:rnd(0.3,0.6),c:'#8a80b8',r:3});
      monsters.length=0; // 남은 그림자 전멸
      for(const t of tents)t.used=true;   // 천막/상점 봉인
      for(const c of chests)c.used=true;  // 상자 봉인
      traps.length=0;
      state='play';
      winSoon();
      return;
    }
    state='play';
    if(e.trialMon&&trial){
      trial.n--;
      if(trial.n<=0){gainXP(xp);openTrialReward();return;}
    }
    if(MAPS[mapIdx].tutorial)tutAdvance(1);
    gainXP(xp); // 레벨업이면 여기서 축복 선택 열림
  }else if(result==='eflee'){ // 적이 도주 (왕관 슬라임)
    const i=monsters.indexOf(e);
    if(i>=0)monsters.splice(i,1);
    state='play';
  }else{ // flee
    e.aggro=false;e.stunT=2.2;e.st='idle';e.stT=2;
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    player.x=clamp(player.x+dx/d*70,player.r,WW-player.r);
    player.y=clamp(player.y+dy/d*70,player.r,WH-player.r);
    resolveObstacles(player);
    state='play';
  }
  updateHUD();
}

function rawXP(v){
  player.xp+=v;
  while(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.level++;
    player.xpNext=Math.round(14+player.level*8);
  }
}
function gainXP(v){
  player.xp+=v;
  if(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.level++;
    player.xpNext=Math.round(14+player.level*8);
    openLevelUp();
  }
  updateHUD();
}

function makeStock(mi){
  const mul=1+mi*0.25;
  const P=v=>Math.max(5,Math.round(v*mul/5)*5);
  const pool=[
    {t:'붉은 물약',d:'HP 50 회복',pr:P(28),fn:()=>{INV.red++;}},
    {t:'보랏빛 물약',d:'전투 중 공격 +40% · SP +1',pr:P(35),fn:()=>{INV.purple++;}},
    {t:'진홍 엘릭서',d:'HP 완전 회복',pr:P(95),fn:()=>{INV.elixir++;}},
    {t:'푸른 물약',d:'MP 12 회복',pr:P(30),fn:()=>{INV.blue++;}},
    {t:'열쇠',d:'잠긴 상자를 열 수 있다',pr:P(45),fn:()=>{INV.key++;sfx.key();}},
    {t:'수련 · 공격',d:'총 데미지 +10%',pr:P(90),fn:()=>{player.dmgMul*=1.1;}},
    {t:'수련 · 체력',d:'최대 HP +25',pr:P(75),fn:()=>{player.maxhp+=25;}},
    {t:'수련 · 치명',d:'치명타 +8%',pr:P(80),fn:()=>{player.crit+=0.08;}},
    {t:'유물 상자',d:'무작위 유물 1개',pr:P(120),fn:()=>{const r=grantRelic();return r?('['+r.name+'] 획득!'):'가진 유물이 이미 전부다! (금화 환불)'; }},
  ];
  const eq=makeEquip(mi);
  pool.push({t:eq.name+' ['+eq.gname+']',d:EQ_SLOTS[eq.slot]+' · '+eqDesc(eq)+(eq.req?' · 요구 '+STATK[eq.reqK]+' '+eq.req:''),
    pr:P(Math.round(28*EQ_GRADES[eq.gi].mul)),
    fn:()=>{
      if(!canEquip(eq))return '몸에 맞지 않는다! (금화 환불)';
      const old=equipItem(eq);
      return old?('교체 완료! 기존 장비는 +'+Math.round(old.price/2)+'G에 팔았다.'):'장착 완료!';
    }});
  return pickN(pool,5).map(o=>Object.assign({sold:false},o));
}

  const r=MAPS[mapIdx].tutorial?0.8:Math.min(0.999,Math.random()+player.LUK*0.03);
  if(r<0.22){
    $('evDesc').innerHTML='자물쇠가 풀리자… 상자에 <em style="color:#ff8a70">이빨</em>이 돋아난다?!';
    const el=document.createElement('button');
    el.className='card';
    el.innerHTML='<div class="icon">⚔️</div><div><div class="name">싸운다!</div><div class="desc">미믹 처치 시 유물 확정</div></div>';
    el.onclick=()=>{
      showOverlay(null);
      const sc=1+Math.max(0,mapIdx-1)*0.42;
      const mm=makeMonster('mimic',c.x,c.y,sc);
      mm.spr=[c.sprKey];
      monsters.push(mm);
      startBattle(mm);
    };
    wrap.appendChild(el);
    showOverlay('event');
    sfx.boss();
    return;
  }
  let msg='';
  if(r<0.45){
    const a=Math.random()<0.6?'red':'purple';
    INV[a]++;INV.red++;
    msg='물약 꾸러미다! <em>붉은 물약'+(a==='red'?' ×2':' + 보랏빛 물약')+'</em> 획득';
  }else if(r<0.72){
    showEquipGain(makeEquip(mapIdx));
    return;
  }else if(r<0.92){
    const rl=grantRelic();
    msg=rl?('🏺 유물 발견! <em>['+rl.name+']</em><br>'+rl.desc):'바닥에서 진홍 엘릭서가 나왔다!';
    if(!rl)INV.elixir++;
  }else{
    const rl=grantRelic();
    INV.red++;INV.key++;
    msg='이중 바닥! '+(rl?'<em>['+rl.name+']</em> + ':'')+'붉은 물약 + 🗝 열쇠까지!';
  }
  sfx.item();
  $('evDesc').innerHTML=msg;
  const el=document.createElement('button');
  el.className='card';
  el.innerHTML='<div class="icon">✔️</div><div><div class="name">계속 간다</div></div>';
  el.onclick=()=>{showOverlay(null);state='play';updateHUD();if(MAPS[mapIdx].tutorial)tutAdvance(4);};
  wrap.appendChild(el);
  showOverlay('event');
}

/* ---------- 필드 몬스터 AI (배회/추격만) ---------- */
function updateMonster(e,dt){
  const p=player;
  e.animT+=dt;
  if(e.alertT>0)e.alertT-=dt;
  if(e.stunT>0){e.stunT-=dt;return;}
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  if(Math.abs(dx)>6)e.flip=dx<0;
  /* 왕관 슬라임: 도망치는 희귀몹 */
  if(e.king){
    if(d<280){
      e.x-=dx/d*e.sp*dt;e.y-=dy/d*e.sp*dt;
      if(e.alertT<=0)e.alertT=0.6;
    }else if(e.st==='wander'){
      e.stT-=dt;
      e.x+=e.wx*e.sp*0.3*dt;e.y+=e.wy*e.sp*0.3*dt;
      if(e.stT<=0){e.st='idle';e.stT=rnd(0.6,1.6);}
    }else{
      e.stT-=dt;
      if(e.stT<=0){e.st='wander';e.stT=rnd(0.6,1.4);const a=rnd(0,TAU);e.wx=Math.cos(a);e.wy=Math.sin(a);}
    }
    resolveObstacles(e);
    repelProps(e);
    return;
  }
  const seeR=e.boss?9999:(e.elite||e.hound?400:280);
  if(d<seeR&&!e.aggro){e.aggro=true;e.alertT=0.8;beep(520,0.08,'square',0.02);}
  if(e.aggro&&d>seeR*2.4&&!e.boss&&!e.elite&&!e.hound)e.aggro=false;

  if(e.aggro){
    if(!e.boss&&!e.elite){e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;} // 보스·파수기사는 제자리를 지킨다
  }else{
    switch(e.st){
      case 'idle':
        e.stT-=dt;
        if(e.stT<=0){
          e.st='wander';e.stT=rnd(0.8,1.8);
          const a=rnd(0,TAU);e.wx=Math.cos(a);e.wy=Math.sin(a);
        }
        break;
      case 'wander':
        e.stT-=dt;
        if(!e.elite){e.x+=e.wx*e.sp*0.35*dt;e.y+=e.wy*e.sp*0.35*dt;} // 파수기사는 문 앞을 지킨다
        if(e.stT<=0){e.st='idle';e.stT=rnd(0.8,2.2);}
        break;
    }
  }
  resolveObstacles(e);
  if(!e.boss)repelProps(e);
  e.x=Math.max(36,Math.min(WW-36,e.x));
  e.y=Math.max(150,Math.min(WH-36,e.y));
}

/* ---------- 필드 업데이트 ---------- */
function update(dt){
  runT+=dt;
  if(mapLabelT>0){mapLabelT-=dt;if(mapLabelT<=0)$('mapLabel').style.opacity=0;}
  encCd=Math.max(0,encCd-dt);
  hitFlash=Math.max(0,hitFlash-dt);
  const p=player;

  const [mx,my]=stickVec();
  p.moving=!!(mx||my);
  if(p.moving){
    p.x+=mx*p.speed*dt;p.y+=my*p.speed*dt;
    p.face=Math.atan2(my,mx);
    if(mx>0.2)p.flip=false;else if(mx<-0.2)p.flip=true;
    p.animT+=dt;
  }
  resolveObstacles(p);

  // 문
  if(gate.open){
    if(p.y<gate.y+68&&Math.abs(p.x-gate.x)<46){
      if(mapIdx<MAPS.length-1){nextMap();return;}
    }
  }
  // 사용된 천막/상자는 맵에서 증발
  if(tents.some(t=>t.used))tents=tents.filter(t=>!t.used);
  if(chests.some(c=>c.used))chests=chests.filter(c=>!c.used);
  // 상호작용 대상 탐지 (자동 발동 없음 — 버튼으로)
  nearAct=null;
  for(const t of tents){
    if(t.used)continue;
    if(dist2(p.x,p.y,t.x,t.y)<74*74){nearAct={type:'tent',o:t};break;}
  }
  if(!nearAct)for(const c of chests){
    if(c.used)continue;
    const d=dist2(p.x,p.y,c.x,c.y);
    c.near=d<140*140;
    if(d<74*74){nearAct={type:'chest',o:c};break;}
  }
  updateActBtn();
  // 맵 경계
  p.x=Math.max(84,Math.min(WW-84,p.x)); // 어두운 가장자리 밴드 진입 금지
  p.y=Math.max(150,Math.min(WH-90,p.y));
  // 튜토리얼: 이동 감지
  if(MAPS[mapIdx].tutorial&&tutStep===0&&p.moving){
    movedD+=p.speed*dt;
    if(movedD>150)tutAdvance(0);
  }
  // 함정: 접근 시 조준 → 화살 발사 (피할 수 있음)
  player.finv=Math.max(0,(player.finv||0)-dt);
  for(const tr of traps){
    tr.cd=Math.max(0,tr.cd-dt);
    if(tr.tele>0){
      tr.tele-=dt;
      if(tr.tele<=0){
        arrows.push({x:tr.x,y:tr.y-6,vx:Math.cos(tr.aim)*290,vy:Math.sin(tr.aim)*290,life:2.4});
        noise(0.08,0.06,2600,'bandpass');
        tr.used=true; // 1회 발사 후 기능 상실
      }
    }else if(!tr.used&&tr.cd<=0&&dist2(tr.x,tr.y,p.x,p.y)<170*170){
      tr.tele=0.55;
      tr.aim=Math.atan2(p.y-tr.y,p.x-tr.x);
      beep(900,0.09,'square',0.04);
    }
  }
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i];
    a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;
    if(a.life<=0||hitObstacle(a.x,a.y,2)){arrows.splice(i,1);continue;}
    if(player.finv<=0&&dist2(a.x,a.y,p.x,p.y-10)<(p.r+4)*(p.r+4)){
      arrows.splice(i,1);
      const dmg=10+mapIdx*3;
      p.hp-=dmg;player.finv=0.9;hitFlash=0.3;
      dmgNums.push({x:p.x,y:p.y-40,v:dmg,t:0.8});
      sfx.hurt();updateHUD();
      if(p.hp<=0){p.hp=0;die();return;}
    }
  }
  // 몬스터
  for(const e of monsters)updateMonster(e,dt);
  // 인카운터!
  if(encCd<=0){
    for(const e of monsters){
      const rr=e.r+p.r+2;
      if(dist2(e.x,e.y,p.x,p.y)<rr*rr){
        if(e.boss){openBossConfirm(e);return;}
        startBattle(e);
        return;
      }
    }
  }
  // 파티클/숫자
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;q.vx*=0.94;q.vy*=0.94;
    if(q.t<=0)parts.splice(i,1);
  }
  for(let i=dmgNums.length-1;i>=0;i--){
    const n=dmgNums[i];n.y-=34*dt;n.t-=dt;
    if(n.t<=0)dmgNums.splice(i,1);
  }
}

/* ---------- 렌더 (필드) ---------- */
function render(){
  const m=MAPS[mapIdx===undefined?0:mapIdx]||MAPS[0];
  const p=player;
  if(p){
    camX=clamp(p.x-W/2,0,Math.max(0,WW-W));
    camY=clamp(p.y-H/2,0,Math.max(0,WH-H));
    if(W>WW)camX=(WW-W)/2;
  }
  camX=Math.round(camX);camY=Math.round(camY);
  cx.fillStyle=m.ground;
  cx.fillRect(0,0,W,H);

  cx.save();
  cx.translate(-camX,-camY);
  const bgIm=MAP_BG_IMG[mapIdx];
  if(bgIm&&bgIm.complete&&bgIm.width){cx.imageSmoothingEnabled=false;cx.drawImage(bgIm,0,0,WW,WH);}
  else if(groundPat){cx.fillStyle=groundPat;cx.fillRect(0,0,WW,WH);}
  cx.fillStyle='#00000055';
  cx.fillRect(0,0,WW,10);cx.fillRect(0,WH-10,WW,10);
  cx.fillRect(0,0,10,WH);cx.fillRect(WW-10,0,10,WH);
  cx.fillStyle=m.detail;
  for(const d of decor||[]){
    if(d.x<camX-20||d.x>camX+W+20||d.y<camY-20||d.y>camY+H+20)continue;
    if(d.k===0){cx.fillRect(d.x,d.y,S,S);cx.fillRect(d.x+S,d.y-S,S,S);}
    else cx.fillRect(d.x,d.y,S*2,S);
  }
  // 북쪽 성문
  if(gate){
    const gx=gate.x,gy=gate.y;
    cx.fillStyle='#00000044';
    cx.beginPath();cx.ellipse(gx,gy+66,92,12,0,0,TAU);cx.fill();
    drawSpr(gate.open?SPR.gateO:SPR.gateC,gx,gy+64,false,4);
    if(gate.open){
      const pu=0.5+Math.sin(runT*3)*0.2;
      const gl=cx.createLinearGradient(gx,gy-26,gx,gy+64);
      gl.addColorStop(0,'rgba(122,232,204,'+(pu*0.65)+')');
      gl.addColorStop(1,'rgba(122,232,204,0)');
      cx.fillStyle=gl;
      cx.fillRect(gx-44,gy-26,88,90);
      cx.fillStyle='#a0f0dc';
      cx.font=PXFONT(12);cx.textAlign='center';
      cx.fillText('▲ 다음 지역',gx,gy+84);
    }else{
      const a=0.5+Math.sin(runT*2.4)*0.3;
      cx.strokeStyle='rgba(224,72,56,'+a+')';
      cx.lineWidth=S;
      cx.beginPath();cx.arc(gx,gy+14,16,0,TAU);cx.stroke();
      cx.beginPath();
      cx.moveTo(gx,gy);cx.lineTo(gx+13,gy+23);cx.lineTo(gx-13,gy+23);cx.closePath();
      cx.stroke();
    }
  }
  if(p){
    const list=[];
    for(const o of obstacles){
      if(o.hidden)continue;
      list.push({y:o.y,fn:()=>{
        cx.fillStyle='#00000044';
        cx.beginPath();cx.ellipse(o.x,o.y+6,o.r+8,9,0,0,TAU);cx.fill();
        if(o.k===0)drawSpr(mapRock,o.x,o.y+12);
        else if(o.k===1)drawSpr(mapIdx===3?mapPillar:mapTree,o.x,o.y+14);
        else drawSpr(mapPillar,o.x,o.y+13);
      }});
    }
    for(const t of tents){
      list.push({y:t.y,fn:()=>{
        cx.fillStyle='#00000044';
        cx.beginPath();cx.ellipse(t.x,t.y+8,34,10,0,0,TAU);cx.fill();
        drawSpr(t.used?SPR.tentUsed:SPR.tent,t.x,t.y+14);
        if(!t.used){
          const bob=Math.sin(runT*3)*3;
          cx.fillStyle='#ffd868';
          cx.font=PXFONT(15);cx.textAlign='center';
          cx.fillText(t.shop?'💰':'?',t.x,t.y-52+bob);
          if(dist2(p.x,p.y,t.x,t.y)<130*130){
            cx.font=PXFONT(10);cx.fillStyle='#fff';
            cx.fillText(t.shop?'상점':'이벤트',t.x,t.y+30);
          }
        }
      }});
    }
    // 함정 바닥판 (엔티티 아래)
    for(const tr of traps){
      cx.fillStyle='#00000055';
      cx.beginPath();cx.ellipse(tr.x,tr.y+3,15,7,0,0,TAU);cx.fill();
      if(tr.used)cx.globalAlpha=0.35;
      cx.fillStyle='#241e18';
      cx.fillRect(tr.x-12,tr.y-5,24,9);
      cx.fillStyle='#4a4238';
      cx.fillRect(tr.x-10,tr.y-3,20,5);
      cx.fillStyle='#8a7a5c';
      cx.fillRect(tr.x-7,tr.y-2,3,3);cx.fillRect(tr.x-1,tr.y-2,3,3);cx.fillRect(tr.x+5,tr.y-2,3,3);
      cx.globalAlpha=1;
      if(tr.tele>0){
        const k=tr.tele/0.55;
        cx.strokeStyle='rgba(255,80,60,'+(0.4+Math.sin(runT*30)*0.3)+')';
        cx.lineWidth=2;
        cx.beginPath();
        cx.moveTo(tr.x,tr.y-6);
        cx.lineTo(tr.x+Math.cos(tr.aim)*220,tr.y-6+Math.sin(tr.aim)*220);
        cx.stroke();
        cx.fillStyle='#ff6a58';
        cx.font=PXFONT(14);cx.textAlign='center';
        cx.fillText('!',tr.x,tr.y-16);
      }
    }
    for(const c of chests){
      list.push({y:c.y,fn:()=>{
        cx.fillStyle='#00000044';
        cx.beginPath();cx.ellipse(c.x,c.y+8,26,9,0,0,TAU);cx.fill();
        if(c.used)cx.globalAlpha=0.4;
        drawSpr(SPR[c.sprKey],c.x,c.y+14);
        cx.globalAlpha=1;
        if(!c.used){
          const bob=Math.sin(runT*3)*3;
          cx.font=PXFONT(13);cx.textAlign='center';
          cx.fillStyle='#ffd868';
          cx.fillText('🗝',c.x,c.y-46+bob);
          if(c.near){
            cx.font=PXFONT(10);
            cx.fillStyle=INV.key>0?'#a0f0dc':'#ff9a8a';
            cx.fillText('잠긴 상자',c.x,c.y+30);
          }
        }
      }});
    }
    for(const e of monsters)list.push({y:e.y,fn:()=>drawMonster(e)});
    list.push({y:p.y,fn:()=>drawPlayer(p)});
    list.sort((a,b)=>a.y-b.y);
    for(const it of list)it.fn();

    // 화살
    for(const a of arrows){
      const ang=Math.atan2(a.vy,a.vx);
      cx.save();cx.translate(a.x,a.y);cx.rotate(ang);
      cx.fillStyle='#c8b890';cx.fillRect(-9,-1,14,2);
      cx.fillStyle='#e8e0d0';
      cx.beginPath();cx.moveTo(8,0);cx.lineTo(2,-4);cx.lineTo(2,4);cx.closePath();cx.fill();
      cx.fillStyle='#a85040';cx.fillRect(-11,-2,3,4);
      cx.restore();
    }
    for(const q of parts){
      cx.globalAlpha=Math.min(1,q.t*2.5);
      cx.fillStyle=q.c;
      cx.fillRect(q.x-q.r,q.y-q.r,q.r*2,q.r*2);
    }
    cx.globalAlpha=1;
    cx.textAlign='center';
    for(const n of dmgNums){
      cx.globalAlpha=Math.min(1,n.t*2);
      cx.font=PXFONT(13);
      cx.fillStyle='#000';cx.fillText(n.v,n.x+1,n.y+1);
      cx.fillStyle=n.heal?'#8af0d0':'#ffe0a0';cx.fillText(n.v,n.x,n.y);
    }
    cx.globalAlpha=1;
  }
  cx.restore();

  // 은은한 시야 + 나침반
  if(p&&state!=='win'){
    const sx=p.x-camX,sy=p.y-camY;
    const R=Math.max(330,360+p.level*6);
    const dg=cx.createRadialGradient(sx,sy,R*0.55,sx,sy,R*1.25);
    dg.addColorStop(0,'rgba(0,0,0,0)');
    dg.addColorStop(1,m.fog+'b8');
    cx.fillStyle=dg;
    cx.fillRect(0,0,W,H);
    let tx=null,ty=null,tc=null;
    if(MAPS[mapIdx]&&MAPS[mapIdx].tutorial){
      if(tutStep===1&&monsters.length){
        let best=null,bd=1e12;
        for(const e of monsters){const dd=dist2(e.x,e.y,p.x,p.y);if(dd<bd){bd=dd;best=e;}}
        if(best){tx=best.x;ty=best.y;tc='#ffd070';}
      }else if(tutStep===3&&tents[0]&&!tents[0].used){tx=tents[0].x;ty=tents[0].y;tc='#ffd070';}
      else if(tutStep===4&&chests[0]&&!chests[0].used){tx=chests[0].x;ty=chests[0].y;tc='#ffd070';}
      else if(tutStep>=5){tx=gate.x;ty=gate.y;tc='#48c8a8';}
    }
    else if(gate&&gate.open){tx=gate.x;ty=gate.y;tc='#48c8a8';}
    else if(warden){tx=warden.x;ty=warden.y;tc='#ffd070';}
    else if(boss){tx=boss.x;ty=boss.y;tc='#c890f0';}
    if(tx!==null){
      const dx=tx-p.x,dy=ty-p.y;
      if(dx*dx+dy*dy>300*300){
        const a=Math.atan2(dy,dx);
        const ax=sx+Math.cos(a)*(Math.min(W,H)*0.34),ay=sy+Math.sin(a)*(Math.min(W,H)*0.34);
        cx.save();
        cx.translate(ax,ay);cx.rotate(a);
        cx.fillStyle=tc;cx.globalAlpha=0.65+Math.sin(runT*4)*0.25;
        cx.beginPath();cx.moveTo(13,0);cx.lineTo(-8,-9);cx.lineTo(-4,0);cx.lineTo(-8,9);cx.closePath();cx.fill();
        cx.restore();
        cx.globalAlpha=1;
      }
    }
  }
  if(hitFlash>0){
    cx.fillStyle=`rgba(224,72,56,${hitFlash*0.5})`;
    cx.fillRect(0,0,W,H);
  }
  if(stick&&state==='play'){
    cx.strokeStyle='#ffffff35';cx.lineWidth=3;
    cx.strokeRect(stick.ox-42,stick.oy-42,84,84);
    let dx=stick.x-stick.ox,dy=stick.y-stick.oy;
    const d=Math.hypot(dx,dy)||1,mm=Math.min(d,38);
    cx.fillStyle='#ffffff45';
    cx.fillRect(stick.ox+dx/d*mm-14,stick.oy+dy/d*mm-14,28,28);
  }
}
function drawPlayer(p){
  cx.fillStyle='#00000044';
  cx.beginPath();cx.ellipse(p.x,p.y+4,16,7,0,0,TAU);cx.fill();
  if(encCd>0&&Math.floor(runT*12)%2===0)return; // 무적시간 깜빡임
  const frame=p.moving&&Math.floor(p.animT*7)%2?SPR.hero2:SPR.hero1;
  const bobY=p.moving&&Math.floor(p.animT*8)%2?-3:0; // 걷기 바운스
  drawSpr(frame,p.x,p.y+8+bobY,p.flip);
  // 등불
  const lx=p.x+(p.flip?12:-12),ly=p.y-10+Math.sin(runT*2.5)*1.5;
  cx.fillStyle='#ffd9a0';
  cx.fillRect(lx-3,ly-4,6,8);
  cx.fillStyle='#ff8a2a';
  cx.fillRect(lx-1,ly-2,3,4);
}
function drawMonster(e){
  cx.fillStyle='#00000044';
  cx.beginPath();cx.ellipse(e.x,e.y+4,e.r+4,7,0,0,TAU);cx.fill();
  const bob=e.fly?Math.sin(e.animT*6)*4-8:0;
  const frame=e.spr.length>1&&Math.floor(e.animT*6)%2?SPR[e.spr[1]]:SPR[e.spr[0]];
  const sc=e.boss?S+1:S;
  drawSpr(frame,e.x,e.y+8+bob,e.flip,sc);
  if(e.king){ // 희귀몹 반짝임
    if(Math.floor(runT*4)%2){
      cx.fillStyle='#ffe060';
      cx.fillRect(e.x+e.r-2+Math.sin(runT*5)*3, e.y-e.r*2-4, S, S);
      cx.fillRect(e.x-e.r+Math.cos(runT*4)*3, e.y-e.r-10, S, S);
    }
  }
  if(e.boss){
    cx.strokeStyle='#3a2450';cx.lineWidth=S+2;
    for(let k=0;k<6;k++){
      const a=runT*0.9+k*TAU/6;
      cx.beginPath();
      cx.moveTo(e.x+Math.cos(a)*e.r*0.9,e.y-e.r+Math.sin(a)*e.r*0.9);
      cx.lineTo(e.x+Math.cos(a+0.4)*(e.r+22+Math.sin(runT*3+k)*7),e.y-e.r+Math.sin(a+0.4)*(e.r+22));
      cx.stroke();
    }
  }
  if(e.alertT>0){
    cx.fillStyle='#ffd868';
    cx.font=PXFONT(16);cx.textAlign='center';
    cx.fillText('!',e.x,e.y-e.r*2-20+bob-Math.sin(e.alertT*10)*2);
  }
  // 이름표 (가까울 때)
  if(dist2(e.x,e.y,player.x,player.y)<170*170){
    cx.font=PXFONT(9);cx.textAlign='center';
    cx.fillStyle='#000000aa';
    cx.fillText(e.name,e.x+1,e.y-e.r*2-8+bob+1);
    cx.fillStyle=e.elite?'#ffd070':(e.boss?'#c890f0':'#c8beac');
    cx.fillText(e.name,e.x,e.y-e.r*2-8+bob);
  }
}

/* ---------- 타이틀 캐릭터 선택 ---------- */
buildHeroSelect();

/* ---------- 메인 루프 ---------- */
document.addEventListener('pointerdown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('button'))sfx.ui();
},true);
$('equipBar').addEventListener('pointerdown',e=>{
  const s=e.target&&e.target.dataset&&e.target.dataset.eq;
  if(s&&player.equip[s]){
    const it=player.equip[s];
    const tip=$('relicTip');
    tip.innerHTML='<em>'+it.name+'</em> ['+it.gname+']<br>'+eqDesc(it);
    tip.style.left=Math.min(window.innerWidth-240,Math.max(8,(e.clientX||60)-40))+'px';
    tip.style.top=((e.clientY||60)+18)+'px';
    tip.style.display='block';
    clearTimeout(relicTipT);
    relicTipT=setTimeout(()=>{tip.style.display='none';},2600);
  }
});
$('relicBar').addEventListener('pointerdown',e=>{
  const k=e.target&&e.target.dataset&&e.target.dataset.k;
  if(k)showRelicTip(k,e.clientX||60,e.clientY||60);
});
$('battle').addEventListener('pointerdown',e=>{
  if(dodgeRun&&!dodgeRun.done){e.preventDefault();resolveDodgeAt(dodgeRun.pos);}
},true);
loadOverrides();
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;
  if(state==='play')update(dt);
  if(state!=='battle')render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
